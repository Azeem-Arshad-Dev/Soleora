server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Precompressed .gz files are written at build time (scripts/precompress.mjs); anything without one
  # is compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml image/svg+xml model/gltf-binary;

  # Pages and other unversioned files: always revalidate (cheap 304s via ETag / Last-Modified).
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Vite output (JS, CSS, fonts) is content-hashed.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images and models keep stable names, so cache for a week and revalidate after that.
  location ^~ /stills/ {
    add_header Cache-Control "public, max-age=604800";
  }

  location ^~ /og/ {
    add_header Cache-Control "public, max-age=604800";
  }

  location ~* \.glb$ {
    types { }
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=604800";
  }

  error_page 404 /404.html;
}
